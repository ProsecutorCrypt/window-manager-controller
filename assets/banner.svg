<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="winA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="winB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="winC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="barB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="barC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <ellipse cx="880" cy="180" rx="360" ry="220" fill="url(#glow)"/>

  <!-- cascading window stack, right side -->
  <g>
    <!-- back window -->
    <rect x="700" y="70" width="380" height="220" rx="10" fill="url(#winA)" stroke="#475569" stroke-width="2"/>
    <rect x="700" y="70" width="380" height="28" rx="10" fill="url(#barA)"/>
    <circle cx="718" cy="84" r="5" fill="#f87171"/>
    <circle cx="736" cy="84" r="5" fill="#fbbf24"/>
    <circle cx="754" cy="84" r="5" fill="#34d399"/>
    <line x1="720" y1="120" x2="1060" y2="120" stroke="#64748b" stroke-width="2" opacity="0.4"/>
    <line x1="720" y1="145" x2="1000" y2="145" stroke="#64748b" stroke-width="2" opacity="0.4"/>

    <!-- middle window -->
    <rect x="760" y="120" width="330" height="190" rx="10" fill="url(#winB)" stroke="#0ea5e9" stroke-width="2" opacity="0.95"/>
    <rect x="760" y="120" width="330" height="26" rx="10" fill="url(#barB)"/>
    <circle cx="778" cy="133" r="5" fill="#fef3c7"/>
    <circle cx="796" cy="133" r="5" fill="#fef3c7" opacity="0.6"/>
    <circle cx="814" cy="133" r="5" fill="#fef3c7" opacity="0.6"/>
    <rect x="782" y="165" width="270" height="10" rx="3" fill="#ffffff" opacity="0.25"/>
    <rect x="782" y="188" width="200" height="10" rx="3" fill="#ffffff" opacity="0.2"/>
    <rect x="782" y="211" width="230" height="10" rx="3" fill="#ffffff" opacity="0.15"/>

    <!-- front window -->
    <rect x="640" y="175" width="290" height="120" rx="10" fill="url(#winC)" stroke="#a855f7" stroke-width="2"/>
    <rect x="640" y="175" width="290" height="26" rx="10" fill="url(#barC)"/>
    <circle cx="658" cy="188" r="5" fill="#f5d0fe"/>
    <circle cx="676" cy="188" r="5" fill="#f5d0fe" opacity="0.6"/>
    <circle cx="694" cy="188" r="5" fill="#f5d0fe" opacity="0.6"/>
    <rect x="660" y="212" width="230" height="10" rx="3" fill="#ffffff" opacity="0.3"/>
    <rect x="660" y="234" width="170" height="10" rx="3" fill="#ffffff" opacity="0.2"/>
  </g>

  <!-- soft accent lines suggesting drag / snap -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.35">
    <path d="M60 300 L 640 250" fill="none" stroke-dasharray="6 6"/>
    <path d="M60 60 L 640 175" fill="none" stroke-dasharray="6 6"/>
  </g>

  <!-- headline -->
  <text x="60" y="150" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="80" fill="#f8fafc" textLength="560" lengthAdjust="spacingAndGlyphs">
    Window
  </text>
  <text x="60" y="235" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="80" fill="#38bdf8" textLength="640" lengthAdjust="spacingAndGlyphs">
    Manager
  </text>

  <!-- tagline -->
  <text x="60" y="278" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#cbd5e1" textLength="600" lengthAdjust="spacingAndGlyphs">
    Controls placement &amp; appearance of windows
  </text>
  <text x="60" y="304" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#94a3b8" textLength="560" lengthAdjust="spacingAndGlyphs">
    within a GUI's windowing system.
  </text>
</svg>